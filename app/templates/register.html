<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrati — ATS Gestione Prescrizioni Cannabis</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-card__brand">ATS Gestione Prescrizioni Cannabis</div>
      <div class="login-card__sottotitolo">Crea un nuovo account operatore</div>

      {% if errore %}
      <div class="errore-form">{{ errore }}</div>
      {% endif %}

      <form method="post" action="/register">
        <div class="campo">
          <label for="nome">Nome e cognome</label>
          <input type="text" id="nome" name="nome" value="{{ nome or '' }}" required autofocus>
        </div>
        <div class="campo">
          <label for="username">Nome utente</label>
          <input type="text" id="username" name="username" value="{{ username or '' }}" required>
        </div>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ email or '' }}" required>
        </div>
        <div class="campo">
          <label for="password">Password</label>
          <div class="campo-password">
            <input type="password" id="password" name="password" required minlength="8">
            <button type="button" class="campo-password__toggle" aria-label="Mostra password"
                    onclick="toggleMostraPassword('password', this)">Mostra</button>
          </div>
        </div>
        <div class="campo">
          <label for="conferma_password">Ripeti password</label>
          <div class="campo-password">
            <input type="password" id="conferma_password" name="conferma_password" required minlength="8">
            <button type="button" class="campo-password__toggle" aria-label="Mostra password"
                    onclick="toggleMostraPassword('conferma_password', this)">Mostra</button>
          </div>
        </div>
        <button type="submit" class="btn btn--primario" style="width:100%; justify-content:center;">
          Crea account
        </button>
      </form>

      <p style="text-align:center; margin-top:16px; font-size:13px;">
        Hai già un account? <a href="/login">Accedi</a>
      </p>
    </div>
  </div>
  <script src="/static/js/password-toggle.js"></script>
</body>
</html>
