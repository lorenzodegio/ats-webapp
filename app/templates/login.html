<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi — ATS Gestione Prescrizioni Cannabis</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-card__brand">ATS Gestione Prescrizioni Cannabis</div>
      <div class="login-card__sottotitolo">Accesso operatori</div>

      {% if errore %}
      <div class="errore-form">{{ errore }}</div>
      {% endif %}
      {% if request.query_params.get('registrato') %}
      <div class="ok-form">Account creato. Ora puoi accedere.</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="campo">
          <label for="username">Nome utente</label>
          <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="campo">
          <label for="password">Password</label>
          <div class="campo-password">
            <input type="password" id="password" name="password" required>
            <button type="button" class="campo-password__toggle" aria-label="Mostra password"
                    onclick="toggleMostraPassword('password', this)">Mostra</button>
          </div>
        </div>
        <button type="submit" class="btn btn--primario" style="width:100%; justify-content:center;">
          Accedi
        </button>
      </form>

      <p style="text-align:center; margin-top:16px; font-size:13px;">
        Non hai un account? <a href="/register">Registrati</a>
      </p>
    </div>
  </div>
  <script src="/static/js/password-toggle.js"></script>
</body>
</html>
