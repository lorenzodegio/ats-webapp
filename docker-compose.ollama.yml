# docker-compose.ollama.yml
# ---------------------------
# Container Ollama, separato dai 4 servizi della pipeline (docker-compose.yml).
#
# GPU ATTIVATA: verificato con `docker run --gpus all ... nvidia-smi`
# che la GPU (RTX 5060 Ti) e' raggiungibile da Docker.
#
# ATTENZIONE: se sulla stessa macchina gira ANCHE l'app desktop nativa
# (che usa la stessa GPU per Ollama installato su Windows), i due
# processi si contendono la stessa memoria video (16GB totali) — non
# farli girare insieme con carichi pesanti contemporaneamente, rischio
# di errori "out of memory" per entrambi.
#
# Uso:
#   docker network create ats-pipeline_default   (una sola volta, se non esiste già)
#   docker compose -f docker-compose.ollama.yml up -d
#   docker exec ats-ollama ollama pull qwen2.5vl:7b
#   docker exec ats-ollama ollama pull qwen2.5vl:32b

networks:
  ats-pipeline_default:
    external: true

services:
  ats-ollama:
    image: ollama/ollama:latest
    container_name: ats-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-dati:/root/.ollama
    networks:
      - ats-pipeline_default
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
