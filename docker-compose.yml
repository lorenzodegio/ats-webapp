# docker-compose.yml
# ---------------------
# Le 4 fasi della pipeline, tutte costruite dalla stessa immagine
# (docker/Dockerfile) — cambia solo il comando (docker/run_fase.py).
#
# OLLAMA: container "ats-ollama" sulla rete esterna ats-pipeline_default
# (docker-compose.ollama.yml). I servizi OCR/difformita lo raggiungono
# come http://ats-ollama:11434.
#
# MODELLI: MODELLO_PESANTE/MODELLO_LEGGERO/OLLAMA_MODEL_TESTO vanno
# impostati qui — le env del terminale host NON entrano nei container.
# Default allineati a Qwen3-VL (test A/B Francesco su macchina ATS).
#
# SERVIZIO "webapp": FastAPI containerizzato (Docker-fuori-da-Docker).
# Richiede HOST_PROJECT_ROOT nel file .env: percorso ASSOLUTO del
# progetto come lo vede Docker Desktop (su WSL2 spesso
# /run/desktop/mnt/host/c/Users/...). Il codice è montato su /workspace
# e uvicorn usa il package `app` (app.main:app), non il vecchio cwd app/.
# Postgres (opzionale): docker-compose.postgres.yml, stesso network.

networks:
  ats-pipeline_default:
    external: true

services:
  webapp:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    working_dir: /workspace
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Rome
      - HOST_PROJECT_ROOT=${HOST_PROJECT_ROOT}
      - POSTGRES_HOST=ats-postgres
    volumes:
      - type: bind
        source: "${HOST_PROJECT_ROOT}"
        target: /workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ats-pipeline_default

  fase1-preprocessing:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["preprocessing"]
    environment:
      - TZ=Europe/Rome
    volumes:
      - ./dati:/dati
    networks:
      - ats-pipeline_default

  fase2-ocr:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["ocr"]
    environment:
      - TZ=Europe/Rome
      - OLLAMA_HOST=http://ats-ollama:11434
      - MODELLO_PESANTE=qwen3-vl:30b-a3b-instruct
      - MODELLO_LEGGERO=qwen3-vl:8b-instruct
      - OLLAMA_MODEL=qwen3-vl:30b-a3b-instruct
    volumes:
      - ./dati:/dati
    networks:
      - ats-pipeline_default

  fase3-difformita:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["difformita"]
    environment:
      - TZ=Europe/Rome
      - OLLAMA_HOST=http://ats-ollama:11434
      - OLLAMA_MODEL_TESTO=qwen3-vl:8b-instruct
    volumes:
      - ./dati:/dati
    networks:
      - ats-pipeline_default

  fase4-excel:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["excel"]
    environment:
      - TZ=Europe/Rome
    volumes:
      - ./dati:/dati
    networks:
      - ats-pipeline_default
